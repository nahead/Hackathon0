# Render.com Configuration
# This file tells Render how to deploy your AI Employee

services:
  # WhatsApp Webhook (Existing)
  - type: web
    name: ai-employee-whatsapp
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python implementation/railway_all_in_one.py
    envVars:
      - key: AGENT_TYPE
        value: cloud
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /health

  # Platinum Tier: Cloud Orchestrator (NEW)
  - type: worker
    name: cloud-orchestrator-platinum
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python implementation/cloud_orchestrator.py
    envVars:
      - key: MODE
        value: cloud
      - key: VAULT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: VAULT_PATH
        value: ./AI_Employee_Vault
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
